name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /haji-training-block
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings → Pages → Source is "Deploy from a branch", GitHub also
      # publishes the old static site from main on every push, and whichever
      # deploy finishes last is what's live. Wait for that branch build to
      # finish so this deploy always lands last. Once the source is
      # "GitHub Actions" there's no branch build and this skips straight on.
      # (The workflow token can read but not change that setting.)
      - name: Wait for any branch-based Pages build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          type=$(gh api "repos/$REPO/pages" --jq .build_type || echo unknown)
          echo "Pages source: $type"
          if [ "$type" = "workflow" ]; then exit 0; fi
          echo "::warning::Pages still deploys from a branch. Set Settings → Pages → Source to GitHub Actions to stop the old site being republished."
          for i in $(seq 1 45); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")]')
            total=$(echo "$runs" | jq length)
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then echo "Branch build finished; deploying after it."; exit 0; fi
            if [ "$total" -eq 0 ] && [ "$i" -ge 12 ]; then echo "No branch build for this commit."; exit 0; fi
            sleep 10
          done
          echo "Timed out waiting for the branch build; deploying anyway."
      - id: deployment
        uses: actions/deploy-pages@v4
