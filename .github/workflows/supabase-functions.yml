name: Supabase functions

# Deploys supabase/functions/* (the Renpho connection) to the app's Supabase project.
# One-time setup: add a repo secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
on:
  push:
    branches: [main, claude/project-thread-lgzcfv]  # the PR branch, so the function can be deployed before merge
    paths: ["supabase/functions/**", ".github/workflows/supabase-functions.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ykfkgmoltgpxjonvomgw
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy renpho
        run: supabase functions deploy renpho --no-verify-jwt --project-ref "$PROJECT_REF"
