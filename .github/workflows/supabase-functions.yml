name: Supabase functions

# Applies supabase/health_records.sql and supabase/nutrition_logs.sql, and deploys supabase/functions/health to the app's
# Supabase project. One-time setup: repo secret SUPABASE_ACCESS_TOKEN
# (supabase.com → Account → Access Tokens).
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/health_records.sql", "supabase/nutrition_logs.sql", ".github/workflows/supabase-functions.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ykfkgmoltgpxjonvomgw
    steps:
      - uses: actions/checkout@v4
      - name: Create the health_records table
        run: |
          jq -n --rawfile q supabase/health_records.sql '{query: $q}' > /tmp/q.json
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          cat /tmp/out.txt; echo
          test "$code" -ge 200 -a "$code" -lt 300
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy health
        run: supabase functions deploy health --no-verify-jwt --project-ref "$PROJECT_REF" --yes
      - name: Create the nutrition_logs table
        run: |
          jq -n --rawfile q supabase/nutrition_logs.sql '{query: $q}' > /tmp/q.json
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          cat /tmp/out.txt; echo
          test "$code" -ge 200 -a "$code" -lt 300
